project:
  name: self-knowledge-gating
  version: 0.1.0

decision:
  actions:
    - answer
    - retrieve
    - clarify
    - abstain
  boundary_states:
    - parametric_known
    - uncertain
    - no_access
    - stale
  reason_codes:
    - AMBIGUOUS_QUESTION
    - INSUFFICIENT_EVIDENCE
    - PARAMETRIC_UNCERTAINTY
    - STALE_PARAMETRIC_MEMORY
    - CONFLICT_UNRESOLVED
    - NO_AUTHORIZED_SOURCE
    - HIGH_RISK_UNSUPPORTED
  thresholds:
    self_knowledge: 0.80
    answerability: 0.75
    evidence_sufficiency: 0.70
    conflict_score: 0.50
    retrieval_utility: 0.00
  calibration:
    method: temperature_scaling
    validation_fraction: 0.20

retrieval:
  enabled: true
  provider: modelscope
  offline: true
  dense_encoder:
    type: flag_embedding
    model_id: BAAI/bge-m3
    local_dir: replace-with-download-output
    revision: replace-with-snapshot-revision
    normalize_embeddings: true
    device: auto
    precision: auto
    pooling: cls
    query_prefix: ""
    max_length: 8192
    batch_size: 16
  reranker:
    type: flag_embedding
    model_id: BAAI/bge-reranker-v2-m3
    local_dir: replace-with-download-output
    revision: replace-with-snapshot-revision
    device: auto
    precision: auto
    max_length: 512
    batch_size: 8
  candidate_top_k: 100
  top_k: 20
  max_context_tokens: 4000
  index_path: data/processed/index
  corpus:
    - matscholar_abstracts
    - chemnlp_arxiv_pubchem
    - mined_recipes
  structured_metadata:
    - materials_project
    - nomad
    - jarvis
    - matbench
  bucket_fields:
    - formula_alias
    - grade_or_state
    - temperature_or_time
    - unit_conversion

evaluation:
  seed: 42
  split: validation
  output_dir: results/runs
  save_evidence_snapshot: true
  primary_metrics:
    - selective_risk
    - coverage
    - retrieval_calls
    - context_tokens
    - latency_p50_ms
    - latency_p95_ms
    - unsupported_answer_rate
    - citation_support_rate
    - no_answer_abstention_accuracy
    - badcase_rate
  retrieval_metrics:
    recall_at_k: [10, 20]
    ndcg_at_k: [10]
    mrr_at_k: [10]
    hard_negative_distinction_rate: true
    buckets:
      - formula_alias
      - grade_or_state
      - temperature_or_time
      - unit_conversion
  pareto:
    sweep_thresholds: true
    cost_dimensions:
      - retrieval_calls
      - context_tokens
      - latency_p95_ms
    retain_non_dominated: true

benchmark:
  domain: materials_science
  source: materials_project
  slices:
    - common_property
    - long_tail
    - canary
    - temporal
    - conflict
    - ambiguous
  evaluator:
    numeric_comparison: deterministic
    categorical_comparison: canonical_exact
    llm_extraction_only: true
    manual_gold_labels: false

abstention:
  risk_target: 0.05
  calibration_methods:
    - temperature_scaling
    - isotonic_regression
    - conformal_abstention
  high_risk_slices:
    - no_access
    - stale
    - conflict
    - canary

conflict:
  adjudication: claim_level
  source_fields:
    - reliability
    - timestamp
    - freshness
    - entailment
    - agreement
  baselines:
    - trust_parameter
    - trust_retrieval
    - majority_rule

runtime:
  model_name: replace-with-model
  api_base: null
